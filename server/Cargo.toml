[package]
name = "dio-lista-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lista_serv"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
simple_logger = "5"
dotenvy = "0.15"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
bytemuck = { version = "1", features = ["derive"] }
jsonwebtoken = "9"
base64 = "0.22"
mcs_bd2 = { path = "../../mcs_bd2" }
lista_comum = { path = "../lista_comum" }
