[workspace]
resolver = "2"
members = ["lista_comum", "server", "frontend-web"]

[package]
name = "dio-lista"
version = "0.1.0"
edition = "2021"
authors = ["MCS Lab"]
description = "Lista — ajuda nas compras do hipermercado (Android / desktop local)"

[dependencies]
dioxus = { version = "=0.7.9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
base64 = "0.22"
web-sys = { version = "0.3", optional = true, features = ["Window", "Storage"] }
lista_comum = { path = "lista_comum" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mcs_bd2 = { path = "../mcs_bd2" }
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"

[features]
default = ["web"]
web = ["dioxus/web", "dep:web-sys"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
