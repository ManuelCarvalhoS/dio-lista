[package]
name = "dio-lista"
version = "0.1.0"
edition = "2021"
authors = ["MCS Lab"]
description = "Lista — ajuda nas compras do hipermercado"

[dependencies]
dioxus = { version = "=0.7.9", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", optional = true, features = ["Window", "Storage"] }

# mcs_bd2 só em nativo (desktop / Android) — não funciona em wasm
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mcs_bd2 = { path = "../mcs_bd2" }
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["web"]
web = ["dioxus/web", "dep:web-sys"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
